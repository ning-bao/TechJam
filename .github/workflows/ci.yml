name: ci

# This file must live in the REPOSITORY ROOT .github/workflows/. It previously
# sat in track5/.github/workflows/, where GitHub never sees it: Actions only
# reads workflows from the repository root, so no push or PR since the repo was
# created ran any tests. The Python project is the track5/ subdirectory, so the
# job sets working-directory instead of the workflow moving down into it.

on: [push, pull_request]

env:
  # Keep uv on the CPU wheel index for torch/torchvision. Without this the
  # `uv pip install -e .` step below re-resolves the bare `torch` dependency
  # from pyproject.toml against PyPI, uninstalls the CPU build, and pulls the
  # full CUDA stack instead — ~2GB of nvidia-* wheels this runner cannot use.
  UV_TORCH_BACKEND: cpu

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: track5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv venv --python 3.13
      - run: uv pip install -e .
      # The lock records torch 2.11.0+cu128 — a CUDA local version that cannot
      # exist on a CPU-only runner, so test_installed_environment_matches_the_lock
      # can never pass here. Deselected rather than weakened: what the lock should
      # assert on a non-CUDA machine is a call for whoever owns the reproducibility
      # story, not something to settle in a workflow file. The other three
      # environment-lock tests (fully-pinned, no editable path, transformers range)
      # still run and are the ones that catch an unpinned or drifted lock.
      - run: >
          uv run pytest -q
          --deselect tests/test_environment_lock.py::test_installed_environment_matches_the_lock
  # NOTE: the D4 shortcut-probe gate (all 4 probes < 60% bAcc) runs locally on
  # real manifests before any training run — it needs the data, not this runner.
